name: Test Release

# Push to a branch named test-release/<anything> (or run it from the Actions
# tab) to publish a downloadable test build as a GitHub pre-release.
on:
  push:
    branches: [ 'test-release/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # build number comes from the commit count

    - name: Run tests
      run: swift test

    - name: Build test DMG
      run: ./make-dmg.sh

    - name: Publish pre-release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="$(tr -d '[:space:]' < Packaging/VERSION)"
        BUILD="$(git rev-list --count HEAD)"
        TAG="v${VERSION}-build${BUILD}"
        cat > notes.md <<NOTES
        Test build of RetroMedia ${VERSION} (build ${BUILD}), from commit ${GITHUB_SHA::7}. Ad-hoc signed.

        Not notarized: the first time, right-click RetroMedia in Applications and choose Open.
        NOTES
        gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
        gh release create "$TAG" build/*.dmg --prerelease --target "$GITHUB_SHA" \
          --title "RetroMedia ${VERSION} build ${BUILD} (test)" --notes-file notes.md
